let __lastValidatedImport = null;

function bumpTestVersion(test) {
  test.version = (test.version || 1) + 1;
  test.updatedAt = nowIso();
  return test;
}

function addQuestionToTest(testId, q) {
  const tests = getTests();
  const idx = tests.findIndex(function (t) { return t.testId === testId; });
  if (idx === -1) return { ok: false, message: 'Test not found.' };
  const test = tests[idx];
  const newId = q.id || ('Q' + (test.questions.length + 1));
  if (test.questions.some(function (existing) { return existing.id === newId; })) {
    return { ok: false, message: 'A question with this ID already exists in this test.' };
  }
  test.questions.push({
    id: newId, questionHtml: q.questionHtml, questionImage: q.questionImage || '',
    options: q.options, correctAnswer: q.correctAnswer, explanationHtml: q.explanationHtml,
    topic: q.topic || '', difficulty: q.difficulty || 'medium', marks: q.marks || test.marksPerQuestion
  });
  bumpTestVersion(test);
  tests[idx] = test;
  setTests(tests);
  return { ok: true };
}
function updateQuestionInTest(testId, questionId, q) {
  const tests = getTests();
  const idx = tests.findIndex(function (t) { return t.testId === testId; });
  if (idx === -1) return { ok: false, message: 'Test not found.' };
  const test = tests[idx];
  const qIdx = test.questions.findIndex(function (x) { return x.id === questionId; });
  if (qIdx === -1) return { ok: false, message: 'Question not found.' };
  test.questions[qIdx] = Object.assign({}, test.questions[qIdx], {
    questionHtml: q.questionHtml, questionImage: q.questionImage || '', options: q.options,
    correctAnswer: q.correctAnswer, explanationHtml: q.explanationHtml, topic: q.topic || '',
    difficulty: q.difficulty || 'medium', marks: q.marks || test.marksPerQuestion
  });
  bumpTestVersion(test);
  tests[idx] = test;
  setTests(tests);
  return { ok: true };
}
function deleteQuestionFromTest(testId, questionId) {
  const tests = getTests();
  const idx = tests.findIndex(function (t) { return t.testId === testId; });
  if (idx === -1) return;
  tests[idx].questions = tests[idx].questions.filter(function (q) { return q.id !== questionId; });
  bumpTestVersion(tests[idx]);
  setTests(tests);
}

/* ---------- Gemini HTML import handlers ---------- */
function importErrorsHtml(errors) {
  return '<div class="notice-box warn"><strong>VALIDATION ERRORS</strong><ul style="margin:8px 0 0 18px;">' + errors.map(function (e) { return '<li>' + escapeHtml(e) + '</li>'; }).join('') + '</ul></div>';
}
function handleValidateImportHtml() {
  const textarea = document.getElementById('import-html-textarea');
  const resultEl = document.getElementById('import-validation-result');
  if (!textarea || !resultEl) return;
  const html = textarea.value;
  const extracted = extractTestJsonFromHtml(html);
  if (!extracted.ok) {
    __lastValidatedImport = null;
    resultEl.innerHTML = importErrorsHtml([extracted.error]);
    return;
  }
  const validation = validateTestData(extracted.data);
  if (!validation.valid) {
    __lastValidatedImport = null;
    resultEl.innerHTML = importErrorsHtml(validation.errors);
    return;
  }
  __lastValidatedImport = { raw: extracted.data, normalized: normalizeImportedTest(extracted.data) };
  resultEl.innerHTML = '<div class="notice-box" style="background:var(--success-bg);color:var(--success);border-color:#bfe5cf;"><strong>VALID TEST</strong> \u2014 ' + extracted.data.questions.length + ' question(s) parsed successfully. You can now Preview or Save.</div>';
  showToast('Validation successful.', 'success');
}
function handlePreviewImportHtml() {
  if (!__lastValidatedImport) {
    handleValidateImportHtml();
    if (!__lastValidatedImport) { showToast('Please fix validation errors first.', 'error'); return; }
  }
  renderTestPreviewModal(__lastValidatedImport.normalized);
}
function handleSaveImportedTest(testId) {
  if (!__lastValidatedImport) { showToast('Please validate the pasted HTML first.', 'warning'); return; }
  showConfirmModal('Replace Questions?', 'This will replace all existing questions and key test settings for this test with the imported content. This cannot be undone.', 'Save Test', function () {
    const tests = getTests();
    const idx = tests.findIndex(function (t) { return t.testId === testId; });
    if (idx === -1) { showToast('Test not found.', 'error'); return; }
    const norm = __lastValidatedImport.normalized;
    const test = tests[idx];
    if (norm.board && norm.board !== test.board) showToast('Note: imported board (' + norm.board + ') differs from the test\u2019s board (' + test.board + '); keeping ' + test.board + '.', 'warning');
    test.chapter = norm.chapter || test.chapter;
    test.title = norm.title || test.title;
    test.durationMinutes = norm.durationMinutes;
    test.marksPerQuestion = norm.marksPerQuestion;
    test.negativeMarking = norm.negativeMarking;
    test.maxAttempts = norm.maxAttempts || test.maxAttempts;
    test.shuffleQuestions = norm.shuffleQuestions;
    test.shuffleOptions = norm.shuffleOptions;
    test.questions = norm.questions;
    bumpTestVersion(test);
    tests[idx] = test;
    setTests(tests);
    __lastValidatedImport = null;
    closeModal();
    showToast('Test saved successfully from imported HTML.', 'success');
    navigate(ROUTES.ADMIN_TEST_EDITOR, { testId: testId });
  });
}

function renderAdminAnalytics() {
  const students = getStudents();
  const tests = getTests();
  const attempts = getAttempts();
  const activeStudents = students.filter(function (s) { return s.active !== false; }).length;
  let highest = null, lowest = null;
  attempts.forEach(function (a) {
    if (highest === null || a.percentage > highest) highest = a.percentage;
    if (lowest === null || a.percentage < lowest) lowest = a.percentage;
  });
  const testPopularity = {};
  attempts.forEach(function (a) { testPopularity[a.testId] = (testPopularity[a.testId] || 0) + 1; });
  let mostAttemptedTitle = '\u2014', mostAttemptedCount = 0;
  Object.keys(testPopularity).forEach(function (tid) {
    if (testPopularity[tid] > mostAttemptedCount) {
      mostAttemptedCount = testPopularity[tid];
      const t = tests.find(function (x) { return x.testId === tid; });
      mostAttemptedTitle = t ? t.title : tid;
    }
  });
  const ov = computeAdminOverview();

  return (
    '<div class="page-head"><div><h1>Analytics</h1><p class="page-sub">Insights computed from the cloud database</p></div></div>' +
    '<h2 class="section-title" style="margin-top:0;">Students</h2>' +
    '<div class="stat-grid">' + statCard('Total', students.length) + statCard('Active', activeStudents) + statCard('Inactive', students.length - activeStudents) + '</div>' +
    '<h2 class="section-title">Tests</h2>' +
    '<div class="stat-grid">' + statCard('Total', tests.length) + statCard('Active', ov.activeTests) + statCard('Total Questions', tests.reduce(function (s, t) { return s + t.questions.length; }, 0)) + '</div>' +
    '<h2 class="section-title">Attempts</h2>' +
    '<div class="stat-grid">' + statCard('Total Attempts', attempts.length) + statCard('Highest %', (highest === null ? '\u2014' : highest + '%')) + statCard('Lowest %', (lowest === null ? '\u2014' : lowest + '%')) + '</div>' +
    '<h2 class="section-title">Performance</h2>' +
    '<div class="stat-grid">' + statCard('Avg Score %', ov.avgScorePct + '%') + statCard('Avg Accuracy', ov.avgAccuracy + '%') + statCard('Most Attempted Test', mostAttemptedTitle.length > 18 ? mostAttemptedTitle.slice(0, 18) + '\u2026' : mostAttemptedTitle) + '</div>' +
    '<div class="card-grid">' +
      '<div class="chart-card"><div class="card-title">Attempts by Date (30 days)</div><canvas id="an-chart-attempts-date"></canvas></div>' +
      '<div class="chart-card"><div class="card-title">Attempts by Subject</div><canvas id="an-chart-attempts-subject"></canvas></div>' +
      '<div class="chart-card"><div class="card-title">Attempts by Test</div><canvas id="an-chart-attempts-test"></canvas></div>' +
      '<div class="chart-card"><div class="card-title">Average Performance by Subject</div><canvas id="an-chart-subject-performance"></canvas></div>' +
      '<div class="chart-card"><div class="card-title">Students by Board</div><canvas id="an-chart-students-board"></canvas></div>' +
      '<div class="chart-card"><div class="card-title">Students by Class</div><canvas id="an-chart-students-class"></canvas></div>' +
    '</div>'
  );
}

function renderAdminAnalyticsCharts() {
  const attempts = getAttempts();
  const students = getStudents();
  const tests = getTests();
  const colors = chartColorPalette();

  const byDate = bucketByDate(attempts, 'submittedAt', 30);
  makeChart('an-chart-attempts-date', { type: 'line', data: { labels: byDate.labels, datasets: [{ label: 'Attempts', data: byDate.data, borderColor: colors[0], backgroundColor: 'rgba(20,73,196,0.12)', fill: true, tension: 0.25 }] }, options: { plugins: { legend: { display: false } } } });

  const bySubject = groupCount(attempts, function (a) { return a.subject; });
  makeChart('an-chart-attempts-subject', { type: 'doughnut', data: { labels: bySubject.labels, datasets: [{ data: bySubject.data, backgroundColor: colors }] } });

  const byTest = {};
  attempts.forEach(function (a) { byTest[a.testId] = (byTest[a.testId] || 0) + 1; });
  const testEntries = Object.keys(byTest).map(function (tid) {
    const t = tests.find(function (x) { return x.testId === tid; });
    return { title: t ? t.title : tid, count: byTest[tid] };
  }).sort(function (a, b) { return b.count - a.count; }).slice(0, 8);
  makeChart('an-chart-attempts-test', { type: 'bar', data: { labels: testEntries.map(function (e) { return e.title.length > 20 ? e.title.slice(0, 20) + '\u2026' : e.title; }), datasets: [{ label: 'Attempts', data: testEntries.map(function (e) { return e.count; }), backgroundColor: colors[1] }] }, options: { indexAxis: 'y', plugins: { legend: { display: false } } } });

  const subjPerf = {};
  attempts.forEach(function (a) {
    if (!subjPerf[a.subject]) subjPerf[a.subject] = { total: 0, count: 0 };
    subjPerf[a.subject].total += a.percentage;
    subjPerf[a.subject].count += 1;
  });
  const subjLabels = Object.keys(subjPerf);
  makeChart('an-chart-subject-performance', { type: 'bar', data: { labels: subjLabels, datasets: [{ label: 'Avg %', data: subjLabels.map(function (l) { return round2(subjPerf[l].total / subjPerf[l].count); }), backgroundColor: colors[2] }] }, options: { plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 100 } } } });

  const byBoard = groupCount(students, function (s) { return s.board; });
  makeChart('an-chart-students-board', { type: 'pie', data: { labels: byBoard.labels, datasets: [{ data: byBoard.data, backgroundColor: colors }] } });

  const byClass = groupCount(students, function (s) { return 'Class ' + s.class; });
  makeChart('an-chart-students-class', { type: 'pie', data: { labels: byClass.labels, datasets: [{ data: byClass.data, backgroundColor: colors.slice().reverse() }] } });
}

function handleRestoreBackupFile(file) {
  readFileAsText(file).then(function (text) {
    let data;
    try { data = JSON.parse(text); } catch (e) { showToast('Invalid backup file \u2014 not valid JSON.', 'error'); return; }
    showConfirmModal('Restore Backup?', 'This will overwrite all current cloud data (Firestore) with the contents of the selected backup file, for every device. This cannot be undone.', 'Restore', function () {
      if (Object.prototype.hasOwnProperty.call(data, 'students')) setStudents(data.students || []);
      if (Object.prototype.hasOwnProperty.call(data, 'boards')) setBoards(data.boards || []);
      if (Object.prototype.hasOwnProperty.call(data, 'classes')) setClasses(data.classes || []);
      if (Object.prototype.hasOwnProperty.call(data, 'subjects')) setSubjects(data.subjects || []);
      if (Object.prototype.hasOwnProperty.call(data, 'tests')) setTests(data.tests || []);
      if (Object.prototype.hasOwnProperty.call(data, 'attempts')) setAttempts(data.attempts || []);
      if (Object.prototype.hasOwnProperty.call(data, 'settings')) setSettings(data.settings || {});
      /* Admin account is intentionally NOT restored from backup \u2014 it stays
         tied to Firebase Authentication, not to this JSON file. */
      closeModal();
      showToast('Backup restored successfully.', 'success');
      render();
    }, true);
  }).catch(function () {
    showToast('Could not read the selected file.', 'error');
  });
}

  const errEl = document.getElementById('register-errors');

    if (errEl) {
      errEl.innerHTML = '<div class="field-error" style="display:block;">' +
        Object.keys(res.errors).map(function (k) { return escapeHtml(res.errors[k]); }).join('<br>') +
        '</div>';
    }
    showToast('Please fix the errors and try again.', 'error');
    return;
  }
  if (errEl) errEl.innerHTML = '';
  showToast('Registration successful! Please log in.', 'success');
  navigate(ROUTES.LOGIN);
}

function handleAdminLoginSubmit() {
  const form = document.getElementById('admin-login-form');
  if (!form) return;
  const fd = new FormData(form);
  const errEl = document.getElementById('admin-login-error');
  const btn = document.getElementById('admin-login-submit-btn');
  if (errEl) { errEl.textContent = ''; errEl.style.display = 'none'; }
  if (btn) { btn.disabled = true; btn.textContent = 'Logging in\u2026'; }
  loginAdmin(fd.get('email'), fd.get('password')).then(function (res) {
    if (btn) { btn.disabled = false; btn.textContent = 'Log In as Admin'; }
    if (!res.ok) {
      if (errEl) { errEl.textContent = res.message; errEl.style.display = 'block'; }
      return;
    }
    showToast('Welcome, admin.', 'success');
    navigate(ROUTES.ADMIN_DASHBOARD);
  });
}

function handleAdminRegisterSubmit() {
  const form = document.getElementById('admin-register-form');
  if (!form) return;
  const fd = new FormData(form);
  const errEl = document.getElementById('admin-register-error');
  const btn = document.getElementById('admin-register-submit-btn');
  if (errEl) { errEl.textContent = ''; errEl.style.display = 'none'; }
  if (btn) { btn.disabled = true; btn.textContent = 'Creating account\u2026'; }
  registerAdmin(fd.get('email'), fd.get('password'), fd.get('confirmPassword')).then(function (res) {
    if (btn) { btn.disabled = false; btn.textContent = 'Create Admin Account'; }
    if (!res.ok) {
      if (errEl) { errEl.textContent = res.message; errEl.style.display = 'block'; }
      return;
    }
    showToast('Admin account created. Welcome!', 'success');
    navigate(ROUTES.ADMIN_DASHBOARD);
  });
}

function handleStudentPasswordSubmit() {
  const form = document.getElementById('student-password-form');
  if (!form) return;
  const fd = new FormData(form);
  const res = changeStudentPassword(fd.get('currentPassword'), fd.get('newPassword'), fd.get('confirmNewPassword'));
  const errEl = document.getElementById('student-password-error');
  if (!res.ok) {
    if (errEl) { errEl.textContent = res.message; errEl.style.display = 'block'; }
    return;
  }
  if (errEl) { errEl.textContent = ''; errEl.style.display = 'none'; }
  showToast('Password changed successfully.', 'success');
  form.reset();
}

/* ---------- Admin table UI-state helpers (shared defaults) ---------- */
function studentsUiState() {
  return getTableState('students', { search: '', board: '', cls: '', page: 1, pageSize: 8, sortKey: 'createdAt', sortDir: 'desc' });
}
function testsUiState() {
  return getTableState('tests', { search: '', board: '', cls: '', status: '', page: 1, pageSize: 8 });
}

const __debouncedStudentsSearch = debounce(function (value) {
  const ui = studentsUiState();
  ui.search = value;
  ui.page = 1;
  refreshAdminStudentsResults();
}, 250);
const __debouncedTestsSearch = debounce(function (value) {
  const ui = testsUiState();
  ui.search = value;
  ui.page = 1;
  refreshAdminTestsResults();
}, 250);

/* ---------- Global click dispatch ---------- */
document.addEventListener('click', function (e) {
  const el = e.target.closest('[data-action]');
  if (!el || el.tagName === 'SELECT') return;

  const action = el.getAttribute('data-action');
  const id = el.getAttribute('data-id');
  const qid = el.getAttribute('data-qid');
  const opt = el.getAttribute('data-opt');
  const indexAttr = el.getAttribute('data-index');
  const dirAttr = el.getAttribute('data-dir');
  const testId = el.getAttribute('data-test-id');
  const studentId = el.getAttribute('data-student-id');
  const attemptId = el.getAttribute('data-attempt-id');
  const route = el.getAttribute('data-route');
  const paramsAttr = el.getAttribute('data-params');
  let params = {};
  if (paramsAttr) {
    try { params = JSON.parse(paramsAttr); } catch (err) { params = {}; }
  }

  switch (action) {
    /* Navigation */
    case 'go': navigate(route, params); break;

    /* Test engine */
    case 'select-option': selectAnswer(qid, opt); break;
    case 'clear-answer': clearAnswer(qid); break;
    case 'toggle-mark': toggleMarkForReview(qid); break;
    case 'goto-question': gotoQuestion(Number(indexAttr)); break;
    case 'test-next': goNextQuestion(); break;
    case 'save-next': goNextQuestion(); break;
    case 'test-prev': goPrevQuestion(); break;
    case 'toggle-palette-mobile': togglePaletteMobile(); break;
    case 'submit-test': confirmSubmitTest(); break;
    case 'start-test': startTest(testId); break;

    /* Result / activity */
    case 'export-pdf': exportResultPdf(attemptId); break;
    case 'contact-teacher': handleContactTeacher(); break;
    case 'student-forgot-password': studentForgotPasswordModal(); break;

    /* Session */
    case 'logout-student': logoutStudent(); break;
    case 'logout-admin': logoutAdmin(); break;

    /* Admin mobile sidebar */
    case 'toggle-admin-sidebar': {
      const sb = document.getElementById('admin-sidebar');
      const bd = document.getElementById('admin-sidebar-backdrop');
      if (sb) sb.classList.toggle('is-open');
      if (bd) bd.classList.toggle('is-open');
      break;
    }
    case 'close-admin-sidebar': {
      const sb = document.getElementById('admin-sidebar');
      const bd = document.getElementById('admin-sidebar-backdrop');
      if (sb) sb.classList.remove('is-open');
      if (bd) bd.classList.remove('is-open');
      break;
    }

    /* Modal system */
    case 'modal-close': closeModal(); break;
    case 'modal-confirm':
      if (typeof __modalConfirmCallback === 'function') __modalConfirmCallback();
      break;

    /* Admin: students */
    case 'admin-edit-student': adminEditStudentModal(studentId); break;
    case 'admin-reset-student-password': adminResetStudentPasswordModal(studentId); break;
    case 'admin-toggle-password-visibility': __adminRevealedPasswordFor = (__adminRevealedPasswordFor === studentId ? null : studentId); render(); break;
    case 'admin-whatsapp-student-credentials': handleAdminWhatsappStudentCredentials(studentId); break;
    case 'admin-toggle-student-active': adminToggleStudentActive(studentId); break;
    case 'admin-delete-student': adminDeleteStudentConfirm(studentId); break;
    case 'export-students-csv': exportStudentsCsv(); break;
    case 'students-page': {
      const ui = studentsUiState();
      ui.page = (ui.page || 1) + Number(dirAttr);
      refreshAdminStudentsResults();
      break;
    }

    /* Admin: academic catalog */
    case 'catalog-add-board': catalogAddBoardModal(); break;
    case 'catalog-edit-board': catalogEditBoardModal(id); break;
    case 'catalog-toggle-board': toggleBoardActive(id); showToast('Board updated.', 'success'); render(); break;
    case 'catalog-delete-board': catalogDeleteBoardConfirm(id); break;
    case 'catalog-add-class': catalogAddClassModal(); break;
    case 'catalog-edit-class': catalogEditClassModal(id); break;
    case 'catalog-toggle-class': toggleClassActive(id); showToast('Class updated.', 'success'); render(); break;
    case 'catalog-delete-class': catalogDeleteClassConfirm(id); break;
    case 'catalog-add-subject': catalogAddSubjectModal(); break;
    case 'catalog-edit-subject': catalogEditSubjectModal(id); break;
    case 'catalog-toggle-subject': toggleSubjectActive(id); showToast('Subject updated.', 'success'); render(); break;
    case 'catalog-delete-subject': catalogDeleteSubjectConfirm(id); break;

    /* Admin: tests */
    case 'admin-add-test': adminAddTestModal(); break;
    case 'admin-preview-test': adminPreviewTestModal(testId); break;
    case 'admin-duplicate-test': adminDuplicateTest(testId); break;
    case 'admin-toggle-test-active': adminToggleTestActive(testId); break;
    case 'admin-delete-test': adminDeleteTestConfirm(testId); break;
    case 'tests-page': {
      const ui = testsUiState();
      ui.page = (ui.page || 1) + Number(dirAttr);
      refreshAdminTestsResults();
      break;
    }

    /* Admin: test editor (questions + Gemini import) */
    case 'add-question': showAddQuestionModal(testId); break;
    case 'edit-question': showEditQuestionModal(testId, qid); break;
    case 'delete-question': confirmDeleteQuestion(testId, qid); break;
    case 'validate-import-html': handleValidateImportHtml(); break;
    case 'preview-import-html': handlePreviewImportHtml(); break;
    case 'save-import-html': handleSaveImportedTest(testId); break;

    /* Admin: Gemini generator */
    case 'generate-gemini-prompt': handleGenerateGeminiPrompt(); break;
    case 'copy-gemini-prompt': handleCopyGeminiPrompt(); break;

    /* Admin: settings / data management */
    case 'export-backup': exportBackup(); break;
    case 'export-attempts-csv': exportAttemptsCsv(); break;
    case 'reset-demo-data': handleResetDemoData(); break;
    case 'clear-all-data': handleClearAllData(); break;

    default: break;
  }
});

/* ---------- Global change dispatch (selects, filters, file inputs) ---------- */
document.addEventListener('change', function (e) {
  const el = e.target;
  if (!el || !el.getAttribute) return;

  if (el.tagName === 'SELECT' && el.hasAttribute('data-action')) {
    const action = el.getAttribute('data-action');
    switch (action) {
      case 'students-filter-board': { const ui = studentsUiState(); ui.board = el.value; ui.page = 1; refreshAdminStudentsResults(); break; }
      case 'students-filter-class': { const ui = studentsUiState(); ui.cls = el.value; ui.page = 1; refreshAdminStudentsResults(); break; }
      case 'students-sort': {
        const ui = studentsUiState();
        const parts = String(el.value).split(':');
        ui.sortKey = parts[0]; ui.sortDir = parts[1] || 'asc';
        refreshAdminStudentsResults();
        break;
      }
      case 'tests-filter-board': { const ui = testsUiState(); ui.board = el.value; ui.page = 1; refreshAdminTestsResults(); break; }
      case 'tests-filter-class': { const ui = testsUiState(); ui.cls = el.value; ui.page = 1; refreshAdminTestsResults(); break; }
      case 'tests-filter-status': { const ui = testsUiState(); ui.status = el.value; ui.page = 1; refreshAdminTestsResults(); break; }
      case 'leaderboard-select-test': {
        const ui = getTableState('adminLeaderboard', { testId: '' });
        ui.testId = el.value;
        render();
        break;
      }
      default: break;
    }
    return;
  }

  if (el.id === 'restore-backup-input') {
    const file = el.files && el.files[0];
    if (file) handleRestoreBackupFile(file);
    el.value = '';
  }
});

/* ---------- Global input dispatch (debounced search boxes) ---------- */
document.addEventListener('input', function (e) {
  const el = e.target;
  if (!el || !el.id) return;
  if (el.id === 'admin-students-search') __debouncedStudentsSearch(el.value);
  if (el.id === 'admin-tests-search') __debouncedTestsSearch(el.value);
});

/* ---------- Global form submit dispatch ---------- */
document.addEventListener('submit', function (e) {
  const form = e.target;
  if (!form || form.tagName !== 'FORM') return;
  e.preventDefault();

  const actionSubmit = form.getAttribute('data-action-submit');
  if (actionSubmit) {
    switch (actionSubmit) {
      case 'student-login-submit': handleStudentLoginSubmit(); return;
      case 'student-register-submit': handleStudentRegisterSubmit(); return;
      case 'admin-login-submit': handleAdminLoginSubmit(); return;
      case 'admin-register-submit': handleAdminRegisterSubmit(); return;
      case 'student-password-submit': handleStudentPasswordSubmit(); return;
      default: break;
    }
  }

  switch (form.id) {
    case 'test-details-form': handleSaveTestDetails(state.params.testId); return;
    case 'settings-general-form': handleSaveGeneralSettings(); return;
    case 'admin-password-form': handleAdminChangePasswordSubmit(); return;
    default: break;
  }

  /* Fallback: a form submitted (e.g. via Enter key) inside an open modal
     triggers that modal's confirm action, matching its button behavior. */
  const modalRoot = document.getElementById('modal-root');
  if (modalRoot && modalRoot.contains(form) && typeof __modalConfirmCallback === 'function') {
    __modalConfirmCallback();
  }
});

/* =====================================================================
   Part 14: APP BOOTSTRAP / INITIALIZATION (Firebase-driven)
   ===================================================================== */

function showBootLoadingScreen() {
  const app = document.getElementById('app');
  if (!app) return;
  app.innerHTML =
    '<div class="centered-shell">' +
      '<div class="auth-card" style="text-align:center;">' +
        brandBlockHtml() +
        '<p class="muted" style="margin-top:10px;">Connecting to the cloud\u2026</p>' +
      '</div>' +
    '</div>';
}

function waitForFirebaseBridge() {
  return new Promise(function (resolve) {
    if (window.__fb) { resolve(); return; }
    window.addEventListener('firebase-ready', function onReady() {
      window.removeEventListener('firebase-ready', onReady);
      resolve();
    });
  });
}

/* Resolves once we have SOME signed-in Firebase user \u2014 either a
   returning admin's persisted email/password session, or a fresh
   anonymous session (used for students / guests, and required by the
   Firestore security rules so reads/writes aren't fully public). */
function ensureFirebaseAuthReady() {
  return new Promise(function (resolve) {
    const fb = window.__fb;
    let settled = false;
    const unsub = fb.onAuthStateChanged(fb.auth, function (user) {
      if (settled) return;
      if (user) {
        settled = true;
        if (unsub) unsub();
        resolve(user);
      } else {
        fb.signInAnonymously(fb.auth).catch(function (err) {
          console.error('[TESTora] Anonymous sign-in failed', err);
          settled = true;
          if (unsub) unsub();
          resolve(null);
        });
        /* If sign-in succeeds, onAuthStateChanged fires again with the
           anonymous user and the branch above resolves this promise. */
      }
    });
  });
}

function loadFirestoreData() {
  return new Promise(function (resolve) { fsSubscribeAll(resolve); });
}

function resumeAppAfterBoot() {
  if (isStudentLoggedIn()) {
    const student = getCurrentStudent();
    if (!student) { clearSession(); navigate(ROUTES.LOGIN); return; }
    const active = getActiveAttempt();
    if (active && active.studentId === student.studentId) {
      navigate(ROUTES.TEST_SCREEN);
    } else {
      navigate(ROUTES.STUDENT_HOME);
    }
    return;
  }

  if (isAdminLoggedIn()) {
    navigate(ROUTES.ADMIN_DASHBOARD);
    return;
  }

  navigate(ROUTES.LOGIN);
}

function bootstrapApp() {
  showBootLoadingScreen();
  waitForFirebaseBridge()
    .then(ensureFirebaseAuthReady)
    .then(loadFirestoreData)
    .then(function () {
      initializeAppData();
      resumeAppAfterBoot();
    })
    .catch(function (err) {
      console.error('[TESTora] Bootstrap failed', err);
      const app = document.getElementById('app');
      if (app) {
        app.innerHTML =
          '<div class="centered-shell"><div class="auth-card" style="text-align:center;">' +
            brandBlockHtml() +
            '<p class="text-danger" style="margin-top:10px;">Could not connect to the cloud database. Please check your internet connection and reload the page.</p>' +
          '</div></div>';
      }
    });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootstrapApp);
} else {
  bootstrapApp();
}
