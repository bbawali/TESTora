<script type="module">
  /* =====================================================================
     TESTora — Firebase bridge
     Loads the Firebase v9+ modular SDK and exposes what the classic
     (non-module) app script below needs on window.__fb, then fires a
     'firebase-ready' event so bootstrapApp() knows it can start.
     ===================================================================== */
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signInAnonymously,
    createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut,
    EmailAuthProvider, reauthenticateWithCredential, updatePassword
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc, onSnapshot
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBbjbcJCssVUpYebOs6idvk7uRWlTP5ak0",
    authDomain: "testora-95a8e.firebaseapp.com",
    projectId: "testora-95a8e",
    storageBucket: "testora-95a8e.firebasestorage.app",
    messagingSenderId: "327505509031",
    appId: "1:327505509031:web:1e1e61199c2369741a3982"
  };

  const fbApp = initializeApp(firebaseConfig);
  const fbAuth = getAuth(fbApp);
  const fbDb = getFirestore(fbApp);

  window.__fb = {
    app: fbApp, auth: fbAuth, db: fbDb,
    onAuthStateChanged: onAuthStateChanged, signInAnonymously: signInAnonymously,
    createUserWithEmailAndPassword: createUserWithEmailAndPassword,
    signInWithEmailAndPassword: signInWithEmailAndPassword, signOut: signOut,
    EmailAuthProvider: EmailAuthProvider,
    reauthenticateWithCredential: reauthenticateWithCredential, updatePassword: updatePassword,
    doc: doc, getDoc: getDoc, setDoc: setDoc, onSnapshot: onSnapshot
  };
  window.dispatchEvent(new Event('firebase-ready'));
</script>
<style>
/* ===========================================================
   TESTora by Biplab Bawali — Design System
   =========================================================== */
:root{
  --primary:#1449c4;
  --primary-dark:#0c2f82;
  --primary-light:#e8eefd;
  --accent:#0aa3a3;
  --background:#f5f7fc;
  --surface:#ffffff;
  --text:#101a33;
  --muted:#5b6987;
  --border:#d9e1f2;
  --success:#158a52;
  --success-bg:#e6f6ee;
  --warning:#a5680a;
  --warning-bg:#fdf3e0;
  --danger:#c62a3f;
  --danger-bg:#fbe8ea;
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(16,26,51,0.06);
  --shadow-md:0 6px 20px rgba(16,26,51,0.10);
  --font-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-display:"Fraunces","Georgia",serif;
  --header-h:64px;
  --sidebar-w:236px;
}
[data-theme="dark"]{
  --background:#0b1526;
  --surface:#101c33;
  --text:#eef2fb;
  --muted:#93a1c4;
  --border:#223257;
  --primary-light:#152651;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--background);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0 0 4px;color:var(--text);}
p{margin:0 0 8px;}
a{color:var(--primary);}
button{font-family:inherit;}
img{max-width:100%;display:block;}
:focus-visible{outline:3px solid #7fa6ff;outline-offset:2px;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* ---------- layout shells ---------- */
#app{min-height:100vh;}
.centered-shell{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;
  background:
    radial-gradient(1100px 500px at 12% -10%, #2a5be0 0%, transparent 55%),
    radial-gradient(900px 480px at 100% 0%, #0aa3a3 0%, transparent 45%),
    linear-gradient(180deg,var(--primary-dark) 0%, #0a1c56 100%);
}
.auth-card{
  width:100%;max-width:436px;background:var(--surface);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-md);padding:34px 32px 28px;
}
.auth-card.wide{max-width:560px;}
.brand-block{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
.brand-mark{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:20px;
}
.brand-title{font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.1;color:var(--primary-dark);}
.brand-sub{font-size:12.5px;color:var(--muted);}
.auth-tabs{display:flex;gap:6px;background:var(--primary-light);padding:4px;border-radius:10px;margin-bottom:20px;}
.auth-tab{flex:1;border:none;background:transparent;padding:9px 10px;border-radius:8px;font-weight:600;color:var(--primary-dark);cursor:pointer;font-size:14.5px;}
.auth-tab.is-active{background:var(--surface);box-shadow:var(--shadow-sm);}

/* ---------- form elements ---------- */
.field{margin-bottom:15px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px;}
.field-hint{font-size:12px;color:var(--muted);margin-top:4px;}
.field-error{font-size:12px;color:var(--danger);margin-top:4px;font-weight:600;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
input[type=text],input[type=password],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  font-size:14.5px;background:var(--surface);color:var(--text);
}
input:focus,select:focus,textarea:focus{border-color:var(--primary);}
textarea{resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);}
.checkbox-row input{width:auto;}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1.5px solid transparent;border-radius:var(--radius-sm);
  padding:10px 18px;font-size:14.5px;font-weight:600;cursor:pointer;
  transition:filter .12s ease, transform .05s ease;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-outline{background:transparent;border-color:var(--border);color:var(--text);}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger-outline{background:transparent;border-color:var(--danger);color:var(--danger);}
.btn-success{background:var(--success);color:#fff;}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:7px;}
.btn-block{width:100%;}
.btn-icon{padding:8px;border-radius:8px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.link-btn{background:none;border:none;color:var(--primary);font-weight:600;cursor:pointer;padding:0;font-size:inherit;}

/* ---------- app shell (logged-in) ---------- */
.app-shell{min-height:100vh;display:flex;flex-direction:column;}
.topbar{
  height:var(--header-h);flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:40;
}
.topbar-left{display:flex;align-items:center;gap:10px;}
.hamburger-btn{display:none;background:none;border:none;cursor:pointer;padding:4px 6px;color:var(--text);font-size:21px;line-height:1;}
.sidebar-backdrop{display:none;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.avatar-chip{
  width:34px;height:34px;border-radius:50%;background:var(--primary-light);color:var(--primary-dark);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;
}
.body-wrap{flex:1;display:flex;min-height:0;}
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  padding:16px 12px;overflow-y:auto;
}
.side-link{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:var(--muted);
  font-weight:600;font-size:14px;cursor:pointer;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;
}
.side-link.is-active{background:var(--primary-light);color:var(--primary-dark);}
.side-link:hover{background:var(--background);}
.side-section-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:14px 12px 6px;font-weight:700;}
.main-content{flex:1;min-width:0;padding:22px 26px 90px;max-width:1180px;width:100%;margin:0 auto;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
.page-head h1{font-size:23px;}
.page-sub{color:var(--muted);font-size:14px;}

/* bottom nav (mobile student) */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;height:64px;background:var(--surface);border-top:1px solid var(--border);
  display:none;justify-content:space-around;align-items:center;z-index:50;
  padding-bottom:env(safe-area-inset-bottom);
}
.bottom-nav-item{
  display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;font-weight:600;
  background:none;border:none;cursor:pointer;flex:1;padding:6px;
}
.bottom-nav-item.is-active{color:var(--primary);}

/* ---------- cards / surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px;}
.card-title{font-size:15px;font-weight:700;margin-bottom:10px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;}
.stat-card .stat-label{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:6px;}
.stat-card .stat-value{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--primary-dark);}
.stat-card.accent-border{border-left:4px solid var(--primary);}
.section-title{font-size:17px;font-weight:700;margin:26px 0 12px;}
.subject-grid,.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.subject-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px;cursor:pointer;
  transition:border-color .12s, box-shadow .12s;position:relative;overflow:hidden;
}
.subject-card:hover{border-color:var(--primary);box-shadow:var(--shadow-sm);}
.subject-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--primary),var(--accent));}
.subject-card h3{font-size:16.5px;padding-left:8px;}
.subject-card p{color:var(--muted);font-size:13px;padding-left:8px;}
.test-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 18px;margin-bottom:12px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center;}
.test-card-info h3{font-size:15.5px;margin-bottom:4px;}
.meta-row{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin-top:4px;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;}
.badge-success{background:var(--success-bg);color:var(--success);}
.badge-warning{background:var(--warning-bg);color:var(--warning);}
.badge-danger{background:var(--danger-bg);color:var(--danger);}
.badge-neutral{background:var(--primary-light);color:var(--primary-dark);}
.empty-state{text-align:center;padding:48px 20px;color:var(--muted);}
.empty-state h3{color:var(--text);margin-bottom:6px;font-size:16px;}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px;}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;}
th{background:var(--background);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;position:sticky;top:0;}
tbody tr:hover{background:var(--primary-light);}
tbody tr:last-child td{border-bottom:none;}
.table-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px;}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;}
.filter-row select,.filter-row input{width:auto;min-width:130px;}
.pagination{display:flex;justify-content:center;gap:6px;padding:14px;align-items:center;}

/* ---------- test engine ---------- */
.test-header{
  position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:10px 18px;gap:12px;flex-wrap:wrap;
}
.timer-pill{
  display:flex;align-items:center;gap:7px;background:var(--primary-light);color:var(--primary-dark);
  padding:8px 16px;border-radius:99px;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;
}
.timer-pill.low-time{background:var(--danger-bg);color:var(--danger);}
.test-body{display:flex;gap:0;align-items:flex-start;min-height:calc(100vh - 60px);}
.question-panel{flex:1;padding:24px 30px 120px;max-width:760px;margin:0 auto;width:100%;}
.q-meta-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.q-text{font-size:16.5px;line-height:1.65;margin-bottom:20px;}
.q-text img{border-radius:8px;margin:10px 0;max-height:320px;}
.option-list{display:flex;flex-direction:column;gap:10px;}
.option-item{
  display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border:1.5px solid var(--border);
  border-radius:var(--radius-md);cursor:pointer;font-size:14.5px;
}
.option-item:hover{border-color:var(--primary);}
.option-item.is-selected{border-color:var(--primary);background:var(--primary-light);}
.option-letter{
  width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;color:var(--muted);
}
.option-item.is-selected .option-letter{background:var(--primary);border-color:var(--primary);color:#fff;}
.test-controls{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap;}
.test-controls-left,.test-controls-right{display:flex;gap:8px;flex-wrap:wrap;}
.palette-panel{width:270px;flex-shrink:0;border-left:1px solid var(--border);background:var(--surface);padding:18px;position:sticky;top:60px;align-self:flex-start;max-height:calc(100vh - 60px);overflow-y:auto;}
.palette-legend{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);margin-bottom:14px;}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;}
.palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;}
.palette-btn{
  aspect-ratio:1;border-radius:7px;border:1.5px solid var(--border);background:var(--surface);font-weight:700;
  font-size:12.5px;cursor:pointer;color:var(--muted);
}
.palette-btn.pal-answered{background:var(--success);border-color:var(--success);color:#fff;}
.palette-btn.pal-marked{background:var(--warning);border-color:var(--warning);color:#fff;}
.palette-btn.pal-answered-marked{background:var(--accent);border-color:var(--accent);color:#fff;}
.palette-btn.pal-current{outline:2.5px solid var(--primary-dark);outline-offset:1px;}
.palette-btn.pal-unanswered{background:var(--surface);}
.mobile-palette-toggle{display:none;}

/* ---------- result / review ---------- */
.result-hero{text-align:center;padding:30px 20px;background:linear-gradient(160deg,var(--primary-dark),var(--primary));border-radius:var(--radius-lg);color:#fff;margin-bottom:22px;}
.result-hero .score-big{font-family:var(--font-display);font-size:48px;font-weight:700;margin:8px 0;}
.review-q{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px;margin-bottom:14px;}
.review-q-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.review-opt{padding:9px 12px;border-radius:8px;border:1.5px solid var(--border);margin-bottom:6px;font-size:13.5px;display:flex;gap:8px;}
.review-opt.opt-correct{border-color:var(--success);background:var(--success-bg);}
.review-opt.opt-wrong{border-color:var(--danger);background:var(--danger-bg);}
.explanation-box{background:var(--primary-light);border-radius:8px;padding:12px 14px;margin-top:10px;font-size:13.5px;}

/* ---------- toast / modal ---------- */
#toast-root{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:340px;}
.toast{background:var(--text);color:#fff;padding:12px 16px;border-radius:9px;font-size:13.5px;box-shadow:var(--shadow-md);
  display:flex;align-items:center;gap:8px;animation:toast-in .18s ease;}
.toast.toast-success{background:var(--success);}
.toast.toast-error{background:var(--danger);}
.toast.toast-warning{background:var(--warning);}
@keyframes toast-in{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
#modal-root{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;padding:20px;}
#modal-root.is-open{display:flex;}
.modal-backdrop{position:absolute;inset:0;background:rgba(10,18,40,0.5);}
.modal-box{position:relative;background:var(--surface);border-radius:var(--radius-lg);max-width:480px;width:100%;padding:24px;box-shadow:var(--shadow-md);max-height:88vh;overflow-y:auto;}
.modal-box.modal-wide{max-width:760px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

/* ---------- misc ---------- */
.divider{height:1px;background:var(--border);margin:18px 0;}
.muted{color:var(--muted);}
.text-danger{color:var(--danger);}
.text-success{color:var(--success);}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;}
.chart-card canvas{max-height:260px;}
.notice-box{border:1.5px dashed var(--border);background:var(--primary-light);border-radius:var(--radius-md);padding:14px 16px;font-size:13px;color:var(--primary-dark);margin-bottom:16px;}
.notice-box.warn{background:var(--warning-bg);color:#7a4e08;border-color:#f0d6a0;}
.step-list{padding-left:20px;}
.step-list li{margin-bottom:8px;font-size:14px;}
.prompt-box{background:#0d1930;color:#d7e2ff;padding:16px;border-radius:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre-wrap;max-height:340px;overflow-y:auto;}
.kv-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;}
.kv-grid dt{color:var(--muted);}
.kv-grid dd{margin:0;font-weight:600;}
.progress-track{height:8px;background:var(--primary-light);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));}
.storage-bar{height:10px;background:var(--border);border-radius:99px;overflow:hidden;margin:8px 0;}
.storage-fill{height:100%;background:var(--primary);}

@media (max-width: 880px){
  .sidebar{display:none;}
  .main-content{padding:16px 14px 96px;}
  .bottom-nav{display:flex;}
  .palette-panel{display:none;}
  .palette-panel.is-open{
    display:block;position:fixed;inset:auto 0 64px 0;width:100%;border-left:none;border-top:1px solid var(--border);
    max-height:46vh;z-index:60;box-shadow:0 -8px 24px rgba(0,0,0,.12);
  }
  .mobile-palette-toggle{display:inline-flex;}
  .test-body{flex-direction:column;}
  .question-panel{padding:18px 16px 130px;}
  .grid-2{grid-template-columns:1fr;}
  .auth-card{padding:26px 20px;}

  /* admin: off-canvas mobile sidebar with hamburger toggle */
  .hamburger-btn{display:inline-flex;}
  .app-shell.is-admin .sidebar{
    display:flex;flex-direction:column;position:fixed;top:var(--header-h);left:0;bottom:0;
    width:78vw;max-width:300px;z-index:70;transform:translateX(-100%);

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
'use strict';
/* =====================================================================
   TESTora by Biplab Bawali
   Single-file local-prototype MCQ mock-test platform.
   Part 1: CONFIG, UTILITIES, STORAGE, SESSION, TOAST, MODAL
   ===================================================================== */

/* ==========================================
   CONFIG
   ========================================== */
const APP_META = {
  name: 'TESTora',
  tagline: 'by Biplab Bawali',
  schemaVersion: '1.0'
};

/* ==========================================
   CONSTANTS
   ========================================== */
/* Per-device keys only — the shared app data (students, tests, attempts,
   catalog, settings, admin) now lives in Firestore; see the FIRESTORE DATA
   SERVICE section below. */
const STORAGE_KEYS = {
  session: 'testora_session',
  appState: 'testora_app_state',
  activeAttempt: 'testora_active_attempt'
};

/* Firestore: one doc per table under this collection, field "data" holds
   the array/object (mirrors the old STORAGE_KEYS table list). */
const FS_COLLECTION = 'testora_data';
const FS_TABLES = ['students', 'boards', 'classes', 'subjects', 'tests', 'attempts', 'settings', 'admin'];
const FS_DEFAULTS = { students: [], boards: [], classes: [], subjects: [], tests: [], attempts: [], settings: {}, admin: null };
const ADMIN_WHATSAPP_FALLBACK = '917980143221';

const QUESTION_DIFFICULTIES = ['easy', 'medium', 'hard'];

/* ==========================================
   UTILITIES
   ========================================== */
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function generateId(prefix) {
  return (prefix ? prefix + '_' : '') + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 9);
}

function nowIso() {
  return new Date().toISOString();
}

function formatDate(iso) {
  if (!iso) return '\u2014';
  try {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '\u2014';
    return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
  } catch (e) { return '\u2014'; }
}

function formatDateTime(iso) {
  if (!iso) return '\u2014';
  try {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '\u2014';
    return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) + ', ' +
      d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  } catch (e) { return '\u2014'; }
}

function formatDurationSeconds(totalSeconds) {
  totalSeconds = Math.max(0, Math.round(totalSeconds || 0));
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

function formatMinutesReadable(totalSeconds) {
  totalSeconds = Math.max(0, Math.round(totalSeconds || 0));
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  if (m <= 0) return s + 's';
  return m + 'm ' + s + 's';
}

function clamp(n, min, max) {
  return Math.min(max, Math.max(min, n));
}

function round2(n) {
  return Math.round((n + Number.EPSILON) * 100) / 100;
}

function debounce(fn, wait) {
  let t = null;
  return function debounced() {
    const args = arguments;
    const ctx = this;
    clearTimeout(t);
    t = setTimeout(function () { fn.apply(ctx, args); }, wait);
  };
}

function normalizePhone(phone) {
  if (!phone) return '';
  let p = String(phone).replace(/[^\d]/g, '');
  if (p.length > 10) p = p.slice(-10);
  return p;
}

function isValidPhone(phone) {
  return /^[6-9]\d{9}$/.test(normalizePhone(phone));
}

function isValidEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || '').trim());
}

function downloadTextFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime || 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}

function readFileAsText(file) {
  return new Promise(function (resolve, reject) {
    const reader = new FileReader();
    reader.onload = function () { resolve(reader.result); };
    reader.onerror = function () { reject(new Error('Could not read file.')); };
    reader.readAsText(file);
  });
}

function toCsvValue(v) {
  if (v === null || v === undefined) return '';
  const s = String(v);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function arrayToCsv(rows) {
  return rows.map(function (row) { return row.map(toCsvValue).join(','); }).join('\r\n');
}

function estimateLocalStorageBytes() {
  let total = 0;
  try {
    for (const key in localStorage) {
      if (!Object.prototype.hasOwnProperty.call(localStorage, key)) continue;
      const val = localStorage.getItem(key) || '';
      total += new Blob([key + val]).size;
    }
  } catch (e) { /* ignore */ }
  return total;
}

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return round2(bytes / 1024) + ' KB';
  return round2(bytes / (1024 * 1024)) + ' MB';
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initials(name) {
  if (!name) return '?';
  const parts = String(name).trim().split(/\s+/);
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

/* ==========================================
   LOCAL DEVICE STORAGE SERVICE
   (session + in-progress-test state only — per device, not synced)
   ========================================== */
function getStorageData(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw === null || raw === undefined) return fallback;
    return JSON.parse(raw);
  } catch (e) {
    console.error('[TESTora] Storage read error for', key, e);
    return fallback;
  }
}

function setStorageData(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (e) {
    console.error('[TESTora] Storage write error for', key, e);
    return false;
  }
}

function removeStorageData(key) {
  try { localStorage.removeItem(key); } catch (e) { console.error(e); }
}

function clearStorageData() {
  Object.keys(STORAGE_KEYS).forEach(function (k) {
    try { localStorage.removeItem(STORAGE_KEYS[k]); } catch (e) { /* ignore */ }
  });
}

function getActiveAttempt() { return getStorageData(STORAGE_KEYS.activeAttempt, null); }
function setActiveAttempt(obj) { return setStorageData(STORAGE_KEYS.activeAttempt, obj); }
function clearActiveAttempt() { removeStorageData(STORAGE_KEYS.activeAttempt); }

/* ==========================================
   FIRESTORE DATA SERVICE
   Shared, cloud-synced data (students, catalog, tests, attempts, settings,
   admin). One Firestore doc per table, kept mirrored into an in-memory
   cache via onSnapshot listeners so the rest of the app can keep reading
   it synchronously with the same getX()/setX() calls as before.
   ========================================== */
let __fsCache = { students: [], boards: [], classes: [], subjects: [], tests: [], attempts: [], settings: {}, admin: null };
let __fsReady = false;
const __fsLoadedTables = {};
const __fsUnsub = {};

function fsTableRef(table) {
  const fb = window.__fb;
  return fb.doc(fb.db, FS_COLLECTION, table);
}

/* Subscribes to every table doc; calls onFirstLoad() once ALL tables have
   delivered their first snapshot. After that, any live update (from this
   tab or another device) refreshes the cache and re-renders. */
function fsSubscribeAll(onFirstLoad) {
  const fb = window.__fb;
  let pending = FS_TABLES.length;
  let firstLoadFired = false;
  FS_TABLES.forEach(function (table) {
    __fsUnsub[table] = fb.onSnapshot(fsTableRef(table), function (snap) {
      const raw = snap.exists() ? snap.data() : null;
      const val = raw && Object.prototype.hasOwnProperty.call(raw, 'data') ? raw.data : undefined;
      __fsCache[table] = (val === undefined) ? FS_DEFAULTS[table] : val;
      if (!__fsLoadedTables[table]) {
        __fsLoadedTables[table] = true;
        pending--;
        if (pending === 0 && !firstLoadFired) { firstLoadFired = true; __fsReady = true; onFirstLoad(); }
      } else if (__fsReady) {
        render();
      }
    }, function (err) {
      console.error('[TESTora] Firestore listen error on', table, err);
      if (!__fsLoadedTables[table]) {
        __fsLoadedTables[table] = true;
        pending--;
        if (pending === 0 && !firstLoadFired) { firstLoadFired = true; __fsReady = true; onFirstLoad(); }
      }
    });
  });
}

function fsWriteTable(table, value) {
  __fsCache[table] = value; /* optimistic local update so getX() right after setX() sees it immediately */
  const fb = window.__fb;
  fb.setDoc(fsTableRef(table), { data: value, updatedAt: new Date().toISOString() })
    .catch(function (e) {
      console.error('[TESTora] Firestore write error on', table, e);
      showToast('Could not sync to the cloud \u2014 check your internet connection.', 'error');
    });
}

function fsClearAllTables() {
  FS_TABLES.forEach(function (table) { fsWriteTable(table, FS_DEFAULTS[table]); });
}

/* Typed collection getters/setters \u2014 same call signatures the rest of the
   app already uses, now backed by the Firestore cache above. */
function getStudents() { return __fsCache.students || []; }
function setStudents(list) { fsWriteTable('students', list); }
function getAdminRecord() { return __fsCache.admin || null; }
function setAdminRecord(rec) { fsWriteTable('admin', rec); }
function getBoards() { return __fsCache.boards || []; }
function setBoards(list) { fsWriteTable('boards', list); }
function getClasses() { return __fsCache.classes || []; }
function setClasses(list) { fsWriteTable('classes', list); }
function getSubjects() { return __fsCache.subjects || []; }
function setSubjects(list) { fsWriteTable('subjects', list); }
function getTests() { return __fsCache.tests || []; }
function setTests(list) { fsWriteTable('tests', list); }
function getAttempts() { return __fsCache.attempts || []; }
function setAttempts(list) { fsWriteTable('attempts', list); }
function getSettings() { return __fsCache.settings || {}; }
function setSettings(obj) { fsWriteTable('settings', obj); }

/* ==========================================
   SESSION SERVICE
   ========================================== */
function getSession() { return getStorageData(STORAGE_KEYS.session, null); }
function setSession(sessionObj) { return setStorageData(STORAGE_KEYS.session, sessionObj); }
function clearSession() { removeStorageData(STORAGE_KEYS.session); }

function isStudentLoggedIn() {
  const s = getSession();
  return !!(s && s.role === 'student' && s.userId);
}
function isAdminLoggedIn() {
  const s = getSession();
  return !!(s && s.role === 'admin');
}
function getCurrentStudent() {
  const s = getSession();
  if (!s || s.role !== 'student') return null;
  return getStudents().find(function (st) { return st.studentId === s.userId; }) || null;
}
function requireStudentId() {
  const s = getSession();
  return s && s.role === 'student' ? s.userId : null;
}

/* ==========================================
   TOAST SYSTEM
   ========================================== */
let __toastCounter = 0;
function showToast(message, type) {
  const root = document.getElementById('toast-root');
  if (!root) return;
  const id = 'toast_' + (++__toastCounter);
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' toast-' + type : '');
  el.id = id;
  el.setAttribute('role', 'status');
  el.innerHTML = '<span>' + toastIcon(type) + '</span><span>' + escapeHtml(message) + '</span>';
  root.appendChild(el);
  setTimeout(function () {
    const node = document.getElementById(id);
    if (node) node.remove();
  }, 3600);
}
function toastIcon(type) {
  if (type === 'success') return '\u2713';
  if (type === 'error') return '\u2715';
  if (type === 'warning') return '\u26A0';
  return '\u2139';
}

/* ==========================================
   MODAL SYSTEM
   ========================================== */
let __modalConfirmCallback = null;
function showModal(opts) {
  const root = document.getElementById('modal-root');
  if (!root) return;
  const wideClass = opts.wide ? ' modal-wide' : '';
  root.innerHTML =
    '<div class="modal-backdrop" data-action="modal-close"></div>' +
    '<div class="modal-box' + wideClass + '" role="dialog" aria-modal="true" aria-label="' + escapeHtml(opts.title || '') + '">' +
    (opts.title ? '<h2 style="font-size:18px;margin-bottom:12px;">' + escapeHtml(opts.title) + '</h2>' : '') +
    '<div class="modal-body">' + (opts.bodyHtml || '') + '</div>' +
    '<div class="modal-actions">' + (opts.actionsHtml || '') + '</div>' +
    '</div>';
  root.classList.add('is-open');
  __modalConfirmCallback = opts.onConfirm || null;
}
function closeModal() {
  const root = document.getElementById('modal-root');
  if (!root) return;
  root.classList.remove('is-open');
  root.innerHTML = '';
  __modalConfirmCallback = null;
}
function showConfirmModal(title, message, confirmLabel, onConfirm, danger) {
  showModal({
    title: title,
    bodyHtml: '<p class="muted">' + escapeHtml(message) + '</p>',
    actionsHtml:
      '<button class="btn btn-outline" data-action="modal-close">Cancel</button>' +
      '<button class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + '" data-action="modal-confirm">' + escapeHtml(confirmLabel || 'Confirm') + '</button>',
    onConfirm: onConfirm
  });
}
/* =====================================================================
   Part 2: DATA INITIALIZATION, ROUTING
   ===================================================================== */

/* ==========================================
   DATA INITIALIZATION
   ========================================== */
/* Seeds default catalog/settings into Firestore the very first time this
   project is used (i.e. the tables are still empty after the initial
   Firestore load). No demo student / demo admin / sample test is seeded
   any more \u2014 admin is created via the Admin Registration screen, and
   students register for real. */
function initializeAppData() {
  if (getBoards().length === 0) {
    setBoards([
      { id: 'board_wbbse', name: 'WBBSE', active: true },
      { id: 'board_cbse', name: 'CBSE', active: true },
      { id: 'board_icse', name: 'ICSE', active: true }
    ]);
  }
  if (getClasses().length === 0) {
    setClasses([
      { id: 'class_10', name: '10', active: true },
      { id: 'class_11', name: '11', active: true },
      { id: 'class_12', name: '12', active: true }
    ]);
  }
  if (getSubjects().length === 0) {
    const subjBoards = ['WBBSE', 'CBSE', 'ICSE'];
    const subjClasses = ['10', '11', '12'];
    const subjectNames = ['Biology', 'Physics', 'Chemistry'];
    const subjects = [];
    subjBoards.forEach(function (board) {
      subjClasses.forEach(function (cls) {
        subjectNames.forEach(function (name) {
          subjects.push({
            id: generateId('subj'),
            board: board,
            class: cls,
            subjectName: name,
            description: name + ' \u2014 ' + board + ' Class ' + cls,
            active: true,
            createdAt: nowIso()
          });
        });
      });
    });
    setSubjects(subjects);
  }
  if (Object.keys(getSettings()).length === 0) {
    setSettings({
      teacherName: 'Biplab Bawali',
      teacherWhatsApp: '',
      teacherWhatsAppMessage: 'Hello Sir, I have a question about a TESTora test.',
      appName: 'TESTora',
      tagline: 'by Biplab Bawali',
      defaultDurationMinutes: 30,
      defaultMarksPerQuestion: 1,
      defaultNegativeMarking: 0.25,
      updatedAt: nowIso()
    });
  }
}

function buildSampleTest(subject) {

/* Resets just the academic catalog (boards/classes/subjects) and general
   settings back to defaults. Students, tests, attempts and the admin
   account are left untouched. */
function resetCatalogDefaults() {
  setBoards([]);
  setClasses([]);
  setSubjects([]);
  setSettings({});
  initializeAppData();
}

/* ==========================================
   ROUTING
   ========================================== */
const state = {
  route: 'LOGIN',
  params: {}
};

const ROUTES = {
  LOGIN: 'LOGIN', REGISTER: 'REGISTER',
  STUDENT_HOME: 'STUDENT_HOME', SUBJECTS: 'SUBJECTS', TEST_LIST: 'TEST_LIST',
  TEST_SCREEN: 'TEST_SCREEN', RESULT: 'RESULT', ANSWER_REVIEW: 'ANSWER_REVIEW',
  ACTIVITY: 'ACTIVITY', PROFILE: 'PROFILE',
  ADMIN_LOGIN: 'ADMIN_LOGIN', ADMIN_DASHBOARD: 'ADMIN_DASHBOARD',
  ADMIN_STUDENTS: 'ADMIN_STUDENTS', ADMIN_STUDENT_DETAIL: 'ADMIN_STUDENT_DETAIL',
  ADMIN_CATALOG: 'ADMIN_CATALOG', ADMIN_TESTS: 'ADMIN_TESTS',
  ADMIN_TEST_EDITOR: 'ADMIN_TEST_EDITOR', ADMIN_ANALYTICS: 'ADMIN_ANALYTICS',
  ADMIN_LEADERBOARD: 'ADMIN_LEADERBOARD', ADMIN_GEMINI: 'ADMIN_GEMINI',
  ADMIN_SETTINGS: 'ADMIN_SETTINGS'
};

const STUDENT_ONLY_ROUTES = [ROUTES.STUDENT_HOME, ROUTES.SUBJECTS, ROUTES.TEST_LIST, ROUTES.TEST_SCREEN, ROUTES.RESULT, ROUTES.ANSWER_REVIEW, ROUTES.ACTIVITY, ROUTES.PROFILE];
const ADMIN_ONLY_ROUTES = [ROUTES.ADMIN_DASHBOARD, ROUTES.ADMIN_STUDENTS, ROUTES.ADMIN_STUDENT_DETAIL, ROUTES.ADMIN_CATALOG, ROUTES.ADMIN_TESTS, ROUTES.ADMIN_TEST_EDITOR, ROUTES.ADMIN_ANALYTICS, ROUTES.ADMIN_LEADERBOARD, ROUTES.ADMIN_GEMINI, ROUTES.ADMIN_SETTINGS];

function navigate(route, params) {
  if (STUDENT_ONLY_ROUTES.indexOf(route) !== -1 && !isStudentLoggedIn()) {
    route = ROUTES.LOGIN;
    params = {};
  }
  if (ADMIN_ONLY_ROUTES.indexOf(route) !== -1 && !isAdminLoggedIn()) {
    route = ROUTES.ADMIN_LOGIN;
    params = {};
  }
  state.route = route;
  state.params = params || {};
  window.scrollTo(0, 0);
  render();
}

function render() {
  stopTimerInterval();
  const app = document.getElementById('app');
  if (!app) return;
  let html = '';
  switch (state.route) {
    case ROUTES.LOGIN: html = renderLogin(); break;
    case ROUTES.REGISTER: html = renderRegister(); break;
    case ROUTES.STUDENT_HOME: html = renderStudentShell(renderStudentHome()); break;
    case ROUTES.SUBJECTS: html = renderStudentShell(renderSubjects()); break;
    case ROUTES.TEST_LIST: html = renderStudentShell(renderTestList()); break;
    case ROUTES.TEST_SCREEN: html = renderTestScreen(); break;
    case ROUTES.RESULT: html = renderStudentShell(renderResult()); break;
    case ROUTES.ANSWER_REVIEW: html = renderStudentShell(renderAnswerReview()); break;
    case ROUTES.ACTIVITY: html = renderStudentShell(renderActivity()); break;
    case ROUTES.PROFILE: html = renderStudentShell(renderProfile()); break;
    case ROUTES.ADMIN_LOGIN: html = renderAdminLogin(); break;
    case ROUTES.ADMIN_DASHBOARD: html = renderAdminShell(renderAdminDashboard(), 'ADMIN_DASHBOARD'); break;
    case ROUTES.ADMIN_STUDENTS: html = renderAdminShell(renderAdminStudents(), 'ADMIN_STUDENTS'); break;
    case ROUTES.ADMIN_STUDENT_DETAIL: html = renderAdminShell(renderAdminStudentDetail(), 'ADMIN_STUDENTS'); break;
    case ROUTES.ADMIN_CATALOG: html = renderAdminShell(renderAdminCatalog(), 'ADMIN_CATALOG'); break;
    case ROUTES.ADMIN_TESTS: html = renderAdminShell(renderAdminTests(), 'ADMIN_TESTS'); break;
    case ROUTES.ADMIN_TEST_EDITOR: html = renderAdminShell(renderAdminTestEditor(), 'ADMIN_TESTS'); break;

function validateRegistrationForm(data) {
  const errors = {};
  if (!data.fullName || data.fullName.trim().length < 2) errors.fullName = 'Enter the full name.';
  if (!isValidPhone(data.phone)) errors.phone = 'Enter a valid 10-digit Indian mobile number.';
  if (!isValidEmail(data.email)) errors.email = 'Enter a valid email address.';
  if (!data.schoolName || data.schoolName.trim().length < 2) errors.schoolName = 'Enter the school name.';
  if (!data.board) errors.board = 'Select a board.';
  if (!data.class) errors.class = 'Select a class.';
  if (!data.password || data.password.length < 4) errors.password = 'Password must be at least 4 characters.';
  if (data.password !== data.confirmPassword) errors.confirmPassword = 'Passwords do not match.';

  const phoneNorm = normalizePhone(data.phone);
  const students = getStudents();
  if (phoneNorm && students.some(function (s) { return s.phone === phoneNorm || s.studentId === phoneNorm; })) {
    errors.phone = 'This phone number is already registered.';
  }
  const emailNorm = String(data.email || '').trim().toLowerCase();
  if (emailNorm && students.some(function (s) { return String(s.email || '').toLowerCase() === emailNorm; })) {
    errors.email = 'This email is already registered.';
  }
  return errors;
}

function registerStudent(data) {
  const errors = validateRegistrationForm(data);
  if (Object.keys(errors).length > 0) return { ok: false, errors: errors };

  const phoneNorm = normalizePhone(data.phone);
  const student = {
    studentId: phoneNorm,
    fullName: data.fullName.trim(),
    phone: phoneNorm,
    email: data.email.trim(),
    schoolName: data.schoolName.trim(),
    board: data.board,
    class: data.class,
    password: data.password,
    isDemo: false,
    active: true,
    createdAt: nowIso()
  };
  const students = getStudents();
  students.push(student);
  setStudents(students);
  return { ok: true, student: student };
}

function loginStudent(idOrPhone, password) {
  const idNorm = normalizePhone(idOrPhone) || String(idOrPhone || '').trim();
  const students = getStudents();
  const student = students.find(function (s) {
    return (s.studentId === idNorm || s.phone === idNorm) && s.password === password;
  });
  if (!student) return { ok: false, message: 'Invalid Student ID / phone number or password.' };
  if (student.active === false) return { ok: false, message: 'This account has been deactivated. Please contact your teacher.' };
  setSession({ role: 'student', userId: student.studentId, loginAt: nowIso() });
  return { ok: true, student: student };
}

/* ---------- Admin auth (real Firebase Authentication, email + password) ---------- */
function fbAuthErrorMessage(err) {
  const code = err && err.code ? err.code : '';
  switch (code) {
    case 'auth/email-already-in-use': return 'An admin account with this email already exists.';
    case 'auth/invalid-email': return 'Enter a valid email address.';
    case 'auth/weak-password': return 'Password should be at least 6 characters.';
    case 'auth/user-not-found':
    case 'auth/wrong-password':
    case 'auth/invalid-credential': return 'Invalid email or password.';
    case 'auth/too-many-requests': return 'Too many attempts. Please wait a bit and try again.';
    case 'auth/network-request-failed': return 'Network error \u2014 check your internet connection.';
    default: return (err && err.message) ? err.message : 'Something went wrong. Please try again.';
  }
}

/* Whether an admin account has ever been registered on this project. Drives
   whether the Admin Login screen shows Login or first-run Registration. */
function isAdminRegistered() {
  return !!getAdminRecord();
}

function registerAdmin(email, password, confirmPassword) {
  const emailNorm = String(email || '').trim().toLowerCase();
  if (!isValidEmail(emailNorm)) return Promise.resolve({ ok: false, message: 'Enter a valid email address.' });
  if (!password || password.length < 6) return Promise.resolve({ ok: false, message: 'Password must be at least 6 characters.' });
  if (password !== confirmPassword) return Promise.resolve({ ok: false, message: 'Passwords do not match.' });
  if (isAdminRegistered()) return Promise.resolve({ ok: false, message: 'An admin account already exists for this app.' });
  const fb = window.__fb;
  return fb.createUserWithEmailAndPassword(fb.auth, emailNorm, password).then(function (cred) {
    setAdminRecord({ email: emailNorm, uid: cred.user.uid, createdAt: nowIso() });
    setSession({ role: 'admin', userId: emailNorm, loginAt: nowIso() });
    return { ok: true };
  }).catch(function (err) {
    return { ok: false, message: fbAuthErrorMessage(err) };
  });
}

function loginAdmin(email, password) {
  const emailNorm = String(email || '').trim().toLowerCase();
  const fb = window.__fb;
  return fb.signInWithEmailAndPassword(fb.auth, emailNorm, password).then(function () {
    setSession({ role: 'admin', userId: emailNorm, loginAt: nowIso() });
    return { ok: true };
  }).catch(function (err) {
    return { ok: false, message: fbAuthErrorMessage(err) };
  });
}

function logoutStudent() {
  clearSession();
  navigate(ROUTES.LOGIN);
}
function logoutAdmin() {
  clearSession();
  const fb = window.__fb;
  if (fb && fb.auth) {
    fb.signOut(fb.auth).then(function () { return fb.signInAnonymously(fb.auth); }).catch(function () {});
  }
  navigate(ROUTES.ADMIN_LOGIN);
}

function changeStudentPassword(currentPassword, newPassword, confirmNewPassword) {
  const student = getCurrentStudent();
  if (!student) return { ok: false, message: 'Not logged in.' };
  if (student.password !== currentPassword) return { ok: false, message: 'Current password is incorrect.' };
  if (!newPassword || newPassword.length < 4) return { ok: false, message: 'New password must be at least 4 characters.' };
  if (newPassword !== confirmNewPassword) return { ok: false, message: 'New passwords do not match.' };
  const students = getStudents();
  const idx = students.findIndex(function (s) { return s.studentId === student.studentId; });
  if (idx === -1) return { ok: false, message: 'Student record not found.' };
  students[idx].password = newPassword;
  setStudents(students);
  return { ok: true };
}

function changeAdminPassword(currentPassword, newPassword, confirmNewPassword) {
  const admin = getAdminRecord();
  if (!admin) return Promise.resolve({ ok: false, message: 'Admin record not found.' });
  if (!newPassword || newPassword.length < 6) return Promise.resolve({ ok: false, message: 'New password must be at least 6 characters.' });
  if (newPassword !== confirmNewPassword) return Promise.resolve({ ok: false, message: 'New passwords do not match.' });
  const fb = window.__fb;
  const user = fb.auth.currentUser;
  if (!user) return Promise.resolve({ ok: false, message: 'Not logged in. Please log in again.' });
  const credential = fb.EmailAuthProvider.credential(admin.email, currentPassword);
  return fb.reauthenticateWithCredential(user, credential)
    .then(function () { return fb.updatePassword(user, newPassword); })
    .then(function () {
      admin.updatedAt = nowIso();
      setAdminRecord(admin);
      return { ok: true };
    })
    .catch(function (err) {
      return { ok: false, message: fbAuthErrorMessage(err) };
    });
}

function adminResetStudentPassword(studentId, newPassword) {
  const students = getStudents();
  const idx = students.findIndex(function (s) { return s.studentId === studentId; });
  if (idx === -1) return { ok: false, message: 'Student not found.' };
  if (!newPassword || newPassword.length < 4) return { ok: false, message: 'New password must be at least 4 characters.' };
  students[idx].password = newPassword;
  setStudents(students);
  return { ok: true };
}

function getAttemptsForStudent(studentId) {
  return getAttempts().filter(function (a) { return a.studentId === studentId; });
}
function getAttemptsForTestByStudent(studentId, testId) {
  return getAttemptsForStudent(studentId).filter(function (a) { return a.testId === testId; });
}

function computeStudentStats(studentId) {
  const attempts = getAttemptsForStudent(studentId);
  if (attempts.length === 0) {
    return { testsAttempted: 0, averageScore: 0, bestScore: 0, averagePercentage: 0, accuracy: 0 };
  }
  let totalScore = 0, bestScore = -Infinity, totalPct = 0, totalCorrect = 0, totalAnswered = 0;
  attempts.forEach(function (a) {
    totalScore += a.score;
    if (a.score > bestScore) bestScore = a.score;
    totalPct += a.percentage;
    totalCorrect += a.correctCount;
    totalAnswered += (a.correctCount + a.wrongCount);
  });
  return {
    testsAttempted: attempts.length,
    averageScore: round2(totalScore / attempts.length),
    bestScore: round2(bestScore),
    averagePercentage: round2(totalPct / attempts.length),

/* =====================================================================
   Part 6: TEST ENGINE + SCORING ENGINE
   ===================================================================== */

let __timerHandle = null;

function startTimerInterval() {
  stopTimerInterval();
  tickTimer();
  __timerHandle = setInterval(tickTimer, 1000);
}
function stopTimerInterval() {
  if (__timerHandle) { clearInterval(__timerHandle); __timerHandle = null; }
}
function computeRemainingSeconds(attempt) {
  const elapsed = (Date.now() - new Date(attempt.startedAt).getTime()) / 1000;
  return Math.max(0, attempt.durationSeconds - elapsed);
}
function tickTimer() {
  const attempt = getActiveAttempt();
  if (!attempt || state.route !== ROUTES.TEST_SCREEN) { stopTimerInterval(); return; }
  const remaining = computeRemainingSeconds(attempt);
  const el = document.getElementById('timer-display');
  const pill = document.getElementById('timer-pill');
  if (el) el.textContent = formatDurationSeconds(remaining);
  if (pill) { if (remaining <= 60) pill.classList.add('low-time'); else pill.classList.remove('low-time'); }
  if (remaining <= 0) {
    stopTimerInterval();
    submitTest(true);
  }
}

function startTest(testId) {
  const student = getCurrentStudent();
  const test = getTests().find(function (t) { return t.testId === testId; });
  if (!test || test.active === false) { showToast('This test is not available.', 'error'); return; }

  const existing = getActiveAttempt();
  if (existing && existing.studentId === student.studentId && existing.testId === testId) {
    navigate(ROUTES.TEST_SCREEN);
    return;
  }
  const priorAttempts = getAttemptsForTestByStudent(student.studentId, testId);
  if (priorAttempts.length >= (test.maxAttempts || 1)) {
    showToast('Maximum attempts reached for this test.', 'warning');
    return;
  }
  if (existing) clearActiveAttempt();

  let questions = test.questions.map(function (q) { return JSON.parse(JSON.stringify(q)); });
  if (test.shuffleQuestions) questions = shuffleArray(questions);
  if (test.shuffleOptions) {
    questions = questions.map(function (q) {
      const q2 = JSON.parse(JSON.stringify(q));
      q2.options = shuffleArray(q2.options);
      return q2;
    });
  }
  const snapshot = Object.assign({}, test, { questions: questions });
  const attempt = {
    attemptId: generateId('attempt'),
    studentId: student.studentId,
    testId: test.testId,
    testVersion: test.version,
    testSnapshot: snapshot,
    startedAt: nowIso(),
    durationSeconds: test.durationMinutes * 60,
    answers: {},
    markedQuestions: [],
    currentQuestionIndex: 0
  };
  setActiveAttempt(attempt);
  navigate(ROUTES.TEST_SCREEN);
}

function selectAnswer(qid, optId) {
  const attempt = getActiveAttempt();
  if (!attempt) return;
  attempt.answers[qid] = optId;
  setActiveAttempt(attempt);
  render();
}
function clearAnswer(qid) {
  const attempt = getActiveAttempt();
  if (!attempt) return;
  delete attempt.answers[qid];
  setActiveAttempt(attempt);
  render();
}
function toggleMarkForReview(qid) {
  const attempt = getActiveAttempt();
  if (!attempt) return;
  const idx = attempt.markedQuestions.indexOf(qid);
  if (idx === -1) attempt.markedQuestions.push(qid); else attempt.markedQuestions.splice(idx, 1);
  setActiveAttempt(attempt);
  render();
}
function gotoQuestion(index) {
  const attempt = getActiveAttempt();
  if (!attempt) return;
  const max = attempt.testSnapshot.questions.length - 1;
  attempt.currentQuestionIndex = clamp(index, 0, max);
  setActiveAttempt(attempt);
  render();
}
function goNextQuestion() { const a = getActiveAttempt(); if (a) gotoQuestion((a.currentQuestionIndex || 0) + 1); }
function goPrevQuestion() { const a = getActiveAttempt(); if (a) gotoQuestion((a.currentQuestionIndex || 0) - 1); }

function togglePaletteMobile() {
  const panel = document.getElementById('palette-panel');
  if (panel) panel.classList.toggle('is-open');
}

function confirmSubmitTest() {
  const attempt = getActiveAttempt();
  if (!attempt) return;
  const total = attempt.testSnapshot.questions.length;
  const answered = Object.keys(attempt.answers).length;
  const unanswered = total - answered;
  showModal({
    title: 'Submit Test?',
    bodyHtml: '<p class="muted">You have answered ' + answered + ' of ' + total + ' questions.' +
      (unanswered > 0 ? ' <strong>' + unanswered + ' question(s) are unanswered.</strong>' : '') +
      ' Once submitted, you cannot change your answers.</p>',
    actionsHtml:
      '<button class="btn btn-outline" data-action="modal-close">Continue Test</button>' +
      '<button class="btn btn-primary" data-action="modal-confirm">Submit Test</button>',
    onConfirm: function () { submitTest(false); }
  });
}

/* ==========================================
   SCORING ENGINE
   ========================================== */
function scoreAttempt(test, answers) {
  let correctCount = 0, wrongCount = 0, unattemptedCount = 0, score = 0, totalMarks = 0;
  const questionResults = test.questions.map(function (q) {
    totalMarks += q.marks;
    const given = answers[q.id];
    let status;
    if (!given) {
      status = 'unattempted'; unattemptedCount++;
    } else if (given === q.correctAnswer) {
      status = 'correct'; correctCount++; score += q.marks;
    } else {
      status = 'wrong'; wrongCount++; score -= (test.negativeMarking || 0);
    }
    return { questionId: q.id, given: given || null, correct: q.correctAnswer, status: status, marks: q.marks };
  });
  score = round2(score);
  const percentage = totalMarks > 0 ? round2((score / totalMarks) * 100) : 0;
  const totalAttempted = correctCount + wrongCount;
  const accuracy = totalAttempted > 0 ? round2((correctCount / totalAttempted) * 100) : 0;
  return { score: score, totalMarks: totalMarks, correctCount: correctCount, wrongCount: wrongCount, unattemptedCount: unattemptedCount, percentage: percentage, accuracy: accuracy, questionResults: questionResults };
}

function submitTest(isAuto) {
  const attempt = getActiveAttempt();
  if (!attempt) return;
  const test = attempt.testSnapshot;
  const result = scoreAttempt(test, attempt.answers);
  const submittedAt = nowIso();
  const timeTaken = Math.max(0, Math.round((new Date(submittedAt).getTime() - new Date(attempt.startedAt).getTime()) / 1000));
  const record = {
    attemptId: attempt.attemptId,
    studentId: attempt.studentId,
    testId: attempt.testId,
    testVersion: attempt.testVersion,
    testTitle: test.title,
    board: test.board,
    class: test.class,
    subject: test.subjectName,
    chapter: test.chapter,
    startedAt: attempt.startedAt,
    submittedAt: submittedAt,
    timeTaken: timeTaken,
    score: result.score,
    totalMarks: result.totalMarks,
    percentage: result.percentage,
    correctCount: result.correctCount,
    wrongCount: result.wrongCount,
    unattemptedCount: result.unattemptedCount,
    accuracy: result.accuracy,
    selectedAnswers: attempt.answers,
    questionResults: result.questionResults,
    testSnapshot: test,
    autoSubmitted: !!isAuto
  };
  const attempts = getAttempts();
  attempts.push(record);
  setAttempts(attempts);
  clearActiveAttempt();
  closeModal();
  navigate(ROUTES.RESULT, { attemptId: record.attemptId });
  showToast(isAuto ? 'Time is up \u2014 your test was submitted automatically.' : 'Test submitted successfully.', 'success');
}

/* ==========================================
   LEADERBOARD
   ========================================== */
function isBetterAttempt(a, b) {
  if (a.score !== b.score) return a.score > b.score;
  if (a.percentage !== b.percentage) return a.percentage > b.percentage;
  if (a.timeTaken !== b.timeTaken) return a.timeTaken < b.timeTaken;
  return new Date(a.submittedAt).getTime() < new Date(b.submittedAt).getTime();
}

function computeLeaderboard(testId) {
  const attempts = getAttempts().filter(function (a) { return a.testId === testId; });
  const bestByStudent = {};
  attempts.forEach(function (a) {
    const cur = bestByStudent[a.studentId];
    if (!cur || isBetterAttempt(a, cur)) bestByStudent[a.studentId] = a;
  });
  const students = getStudents();
  const rows = Object.keys(bestByStudent).map(function (sid) {
    const a = bestByStudent[sid];
    const student = students.find(function (s) { return s.studentId === sid; });
    return {
      studentId: sid,
      name: student ? student.fullName : 'Unknown Student',
      school: student ? student.schoolName : '\u2014',
      score: a.score,
      totalMarks: a.totalMarks,
      percentage: a.percentage,
      timeTaken: a.timeTaken,
      submittedAt: a.submittedAt
    };
  });
  rows.sort(function (x, y) {
    if (y.score !== x.score) return y.score - x.score;
    if (y.percentage !== x.percentage) return y.percentage - x.percentage;
    if (x.timeTaken !== y.timeTaken) return x.timeTaken - y.timeTaken;
    return new Date(x.submittedAt).getTime() - new Date(y.submittedAt).getTime();
  });
  return rows;
}

function leaderboardTableHtml(testId, highlightStudentId, limit) {
  const rows = computeLeaderboard(testId);
  const shown = limit ? rows.slice(0, limit) : rows;
  if (rows.length === 0) return emptyState('No leaderboard yet', 'Leaderboard data will appear after students complete this test.');
  const body = shown.map(function (r, i) {
    const isMe = r.studentId === highlightStudentId;
    return (
      '<tr' + (isMe ? ' style="background:var(--primary-light);font-weight:700;"' : '') + '>' +
        '<td>' + (i + 1) + '</td>' +
        '<td>' + escapeHtml(r.name) + (isMe ? ' <span class="badge badge-neutral">You</span>' : '') + '</td>' +
        '<td>' + escapeHtml(r.school) + '</td>' +
        '<td>' + r.score + ' / ' + r.totalMarks + '</td>' +
        '<td>' + r.percentage + '%</td>' +
        '<td>' + formatDurationSeconds(r.timeTaken) + '</td>' +
      '</tr>'
    );
  }).join('');
  return '<div class="table-wrap"><table><thead><tr><th>Rank</th><th>Student</th><th>School</th><th>Score</th><th>%</th><th>Time</th></tr></thead><tbody>' + body + '</tbody></table></div>';
}

function exportResultPdf(attemptId) {
  const attempt = getAttempts().find(function (a) { return a.attemptId === attemptId; });
  if (!attempt) { showToast('Result not found.', 'error'); return; }
  if (typeof window.jspdf === 'undefined' || typeof window.html2canvas === 'undefined') {
    showToast('PDF library failed to load. Check your internet connection and try again.', 'error');
    return;
  }
  const student = getStudents().find(function (s) { return s.studentId === attempt.studentId; });
  const container = buildPdfContainer(attempt, student);
  document.body.appendChild(container);
  showToast('Preparing your PDF\u2026', 'info');
  window.html2canvas(container, { scale: 2, useCORS: true, backgroundColor: '#ffffff' }).then(function (canvas) {
    try {
      const jsPDFCtor = window.jspdf.jsPDF;
      const pdf = new jsPDFCtor('p', 'pt', 'a4');
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      const imgWidth = pageWidth;
      const imgHeight = (canvas.height * imgWidth) / canvas.width;
      const imgData = canvas.toDataURL('image/png');
      let heightLeft = imgHeight;
      let position = 0;
      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
      while (heightLeft > 0) {
        position = heightLeft - imgHeight;
        pdf.addPage();
        pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;
      }
      const totalPages = pdf.internal.getNumberOfPages();
      for (let p = 1; p <= totalPages; p++) {
        pdf.setPage(p);
        pdf.setFontSize(8.5);
        pdf.setTextColor(120);
        pdf.text('TESTora by Biplab Bawali', 24, pageHeight - 16);
        pdf.text('Page ' + p + ' of ' + totalPages, pageWidth - 78, pageHeight - 16);
      }
      pdf.save('TESTora_' + attempt.studentId + '_' + attempt.attemptId + '.pdf');
      showToast('PDF exported successfully.', 'success');
    } catch (e) {
      console.error(e);
      showToast('Could not generate the PDF.', 'error');
    } finally {
      document.body.removeChild(container);
    }
  }).catch(function (e) {
    console.error(e);
    showToast('Could not generate the PDF.', 'error');
    if (container.parentNode) document.body.removeChild(container);
  });
}

/* ==========================================
   HTML SANITIZATION
   ========================================== */
function sanitizeHtml(html) {
  if (!html) return '';
  if (typeof DOMPurify !== 'undefined') {
    return DOMPurify.sanitize(html, {
      ALLOWED_TAGS: ['p', 'br', 'b', 'strong', 'i', 'em', 'u', 'sub', 'sup', 'ul', 'ol', 'li', 'span', 'div', 'table', 'thead', 'tbody', 'tr', 'td', 'th', 'img', 'a', 'code', 'pre', 'blockquote', 'h1', 'h2', 'h3', 'h4', 'small', 'hr'],
      ALLOWED_ATTR: ['src', 'alt', 'href', 'title', 'class', 'target', 'rel']
    });
  }
  return String(html)
    .replace(/<script[\s\S]*?<\/script>/gi, '')
    .replace(/<iframe[\s\S]*?<\/iframe>/gi, '')
    .replace(/<object[\s\S]*?<\/object>/gi, '')
    .replace(/<embed[\s\S]*?>/gi, '')
    .replace(/ on\w+="[^"]*"/gi, '')
    .replace(/ on\w+='[^']*'/gi, '')
    .replace(/javascript:/gi, '');
}

/* ==========================================
   HTML TEST PARSER
   ========================================== */
function extractTestJsonFromHtml(htmlString) {
  if (!htmlString || !htmlString.trim()) {
    return { ok: false, error: 'The pasted HTML is empty.' };
  }
  let doc;
  try {
    const parser = new DOMParser();
    doc = parser.parseFromString(htmlString, 'text/html');
  } catch (e) {
    return { ok: false, error: 'Could not parse the HTML document.' };
  }
  const scriptEl = doc.getElementById('testora-data');
  if (!scriptEl) {
    return { ok: false, error: 'Could not find a <script type="application/json" id="testora-data"> block in the pasted HTML.' };
  }
  let json;
  try {
    json = JSON.parse(scriptEl.textContent);
  } catch (e) {
    return { ok: false, error: 'The testora-data block does not contain valid JSON (' + e.message + ').' };
  }
  return { ok: true, data: json };
}

/* ==========================================
   VALIDATOR
   ========================================== */
function validateTestData(data) {
  const errors = [];
  if (!data || typeof data !== 'object') {
    return { valid: false, errors: ['The parsed data is not a valid object.'] };
  }
  if (!data.schemaVersion) errors.push('Missing "schemaVersion".');
  if (!data.meta || typeof data.meta !== 'object') {
    errors.push('Missing "meta" object.');
  } else {
    const meta = data.meta;
    if (!meta.board) errors.push('meta.board is required.');
    if (!meta.class) errors.push('meta.class is required.');
    if (!meta.subject) errors.push('meta.subject is required.');
    if (!meta.title) errors.push('meta.title is required.');
    if (!meta.durationMinutes || isNaN(Number(meta.durationMinutes)) || Number(meta.durationMinutes) <= 0) {
      errors.push('meta.durationMinutes must be a positive number.');
    }
    if (meta.marksPerQuestion !== undefined && (isNaN(Number(meta.marksPerQuestion)) || Number(meta.marksPerQuestion) <= 0)) {
      errors.push('meta.marksPerQuestion must be a positive number.');
    }
    if (meta.negativeMarking !== undefined && (isNaN(Number(meta.negativeMarking)) || Number(meta.negativeMarking) < 0)) {
      errors.push('meta.negativeMarking cannot be negative.');
    }
  }
  if (!Array.isArray(data.questions) || data.questions.length === 0) {
    errors.push('"questions" array is required and must contain at least one question.');
  } else {
    const seenIds = {};
    data.questions.forEach(function (q, idx) {
      const label = 'Question ' + (idx + 1) + (q && q.id ? ' (' + q.id + ')' : '');
      if (!q || typeof q !== 'object') { errors.push(label + ': not a valid object.'); return; }
      if (!q.id) errors.push(label + ': missing "id".');
      else if (seenIds[q.id]) errors.push(label + ': duplicate question id "' + q.id + '".');
      else seenIds[q.id] = true;
      if (!q.questionHtml && !q.questionText) errors.push(label + ': missing question text.');
      if (!Array.isArray(q.options) || q.options.length !== 4) {
        errors.push(label + ': must have exactly four options.');
      } else {
        const optIds = q.options.map(function (o) { return o && o.id; });
        const uniqueCount = {};
        optIds.forEach(function (id) { if (id) uniqueCount[id] = (uniqueCount[id] || 0) + 1; });
        const hasDup = Object.keys(uniqueCount).some(function (id) { return uniqueCount[id] > 1; });
        if (hasDup) errors.push(label + ': option ids must be unique.');
        ['A', 'B', 'C', 'D'].forEach(function (letter) {
          if (optIds.indexOf(letter) === -1) errors.push(label + ': missing option "' + letter + '".');
        });
        q.options.forEach(function (o, oi) {
          if (!o || !o.text || !String(o.text).trim()) errors.push(label + ': option ' + (oi + 1) + ' is missing text.');
        });
      }
      if (!q.correctAnswer || ['A', 'B', 'C', 'D'].indexOf(q.correctAnswer) === -1) {
        errors.push(label + ': correctAnswer must be one of A, B, C or D.');
      }
      if (!q.explanationHtml && !q.explanationText) errors.push(label + ': missing explanation.');
      if (q.marks !== undefined && (isNaN(Number(q.marks)) || Number(q.marks) <= 0)) {
        errors.push(label + ': marks must be a positive number.');
      }
      if (q.difficulty && QUESTION_DIFFICULTIES.indexOf(q.difficulty) === -1) {
        errors.push(label + ': difficulty should be easy, medium or hard.');
      }
    });
  }
  return { valid: errors.length === 0, errors: errors };
}

function normalizeImportedTest(data) {
  const meta = data.meta;
  const marksDefault = Number(meta.marksPerQuestion) || 1;
  const questions = data.questions.map(function (q, idx) {
    return {
      id: q.id || ('Q' + (idx + 1)),
      questionHtml: q.questionHtml || ('<p>' + escapeHtml(q.questionText || '') + '</p>'),
      questionImage: q.questionImage || '',
      options: q.options.map(function (o) { return { id: o.id, text: o.text }; }),
      correctAnswer: q.correctAnswer,
      explanationHtml: q.explanationHtml || ('<p>' + escapeHtml(q.explanationText || '') + '</p>'),
      topic: q.topic || meta.chapter || '',
      difficulty: q.difficulty || 'medium',
      marks: Number(q.marks) || marksDefault
    };
  });
  return {
    board: meta.board,
    class: String(meta.class),
    subjectName: meta.subject,
    chapter: meta.chapter || '',
    title: meta.title,
    durationMinutes: Number(meta.durationMinutes) || 30,
    marksPerQuestion: marksDefault,
    negativeMarking: meta.negativeMarking !== undefined ? Number(meta.negativeMarking) : 0,
    maxAttempts: Number(meta.maxAttempts) || 1,
    shuffleQuestions: meta.shuffleQuestions !== false,
    shuffleOptions: meta.shuffleOptions !== false,
    questions: questions
  };
}

function copyTextToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () {
      showToast('Copied to clipboard.', 'success');
    }).catch(function () {
      fallbackCopyText(text);
    });
  } else {
    fallbackCopyText(text);
  }
}
function fallbackCopyText(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('Copied to clipboard.', 'success');
  } catch (e) {
    showToast('Could not copy automatically. Please select and copy manually.', 'warning');
  }
  document.body.removeChild(ta);
}

const tableUiState = {};
function getTableState(name, defaults) {
  if (!tableUiState[name]) tableUiState[name] = Object.assign({}, defaults);

function lastActivityDate(studentId) {
  const attempts = getAttemptsForStudent(studentId);
  if (attempts.length === 0) return null;
  let latest = attempts[0].submittedAt;
  attempts.forEach(function (a) { if (new Date(a.submittedAt).getTime() > new Date(latest).getTime()) latest = a.submittedAt; });
  return latest;
}

/* ==========================================
   ADMIN ANALYTICS (shared helpers)
   ========================================== */
function computeAdminOverview() {
  const students = getStudents();
  const subjects = getSubjects();
  const tests = getTests();
  const attempts = getAttempts();
  const activeTests = tests.filter(function (t) { return t.active !== false; }).length;
  let avgScorePct = 0, avgAccuracy = 0;
  if (attempts.length > 0) {
    avgScorePct = round2(attempts.reduce(function (s, a) { return s + a.percentage; }, 0) / attempts.length);
    const totalAttempted = attempts.reduce(function (s, a) { return s + a.correctCount + a.wrongCount; }, 0);
    const totalCorrect = attempts.reduce(function (s, a) { return s + a.correctCount; }, 0);
    avgAccuracy = totalAttempted > 0 ? round2((totalCorrect / totalAttempted) * 100) : 0;
  }
  return {
    totalStudents: students.length, totalSubjects: subjects.length, totalTests: tests.length,
    totalAttempts: attempts.length, activeTests: activeTests, avgScorePct: avgScorePct, avgAccuracy: avgAccuracy
  };
}

function bucketByDate(items, dateField, days) {
  const buckets = {};
  const labels = [];
  const today = new Date();
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0, 10);
    labels.push(key);
    buckets[key] = 0;
  }
  items.forEach(function (it) {
    const iso = it[dateField];
    if (!iso) return;
    const key = new Date(iso).toISOString().slice(0, 10);
    if (Object.prototype.hasOwnProperty.call(buckets, key)) buckets[key]++;
  });
  return { labels: labels.map(function (l) { return l.slice(5); }), data: labels.map(function (l) { return buckets[l]; }) };
}

function groupCount(items, keyFn) {
  const map = {};
  items.forEach(function (it) {
    const k = keyFn(it) || 'Unknown';
    map[k] = (map[k] || 0) + 1;
  });
  const labels = Object.keys(map);
  return { labels: labels, data: labels.map(function (l) { return map[l]; }) };
}

function renderAdminDashboardCharts() {
  const students = getStudents();

  makeChart('chart-registrations', { type: 'line', data: { labels: reg.labels, datasets: [{ label: 'Registrations', data: reg.data, borderColor: colors[0], backgroundColor: 'rgba(20,73,196,0.12)', fill: true, tension: 0.3 }] }, options: { plugins: { legend: { display: false } } } });

  const att = bucketByDate(attempts, 'submittedAt', 14);
  makeChart('chart-attempts-trend', { type: 'line', data: { labels: att.labels, datasets: [{ label: 'Attempts', data: att.data, borderColor: colors[1], backgroundColor: 'rgba(10,163,163,0.12)', fill: true, tension: 0.3 }] }, options: { plugins: { legend: { display: false } } } });

  const byBoard = groupCount(students, function (s) { return s.board; });

    return Object.assign({}, s, { _testsAttempted: stats.testsAttempted, _avgScore: stats.averageScore, _lastActivity: lastActivityDate(s.studentId) });
  });
  if (ui.search) {
    const q = ui.search.toLowerCase();
    students = students.filter(function (s) {
      return (s.fullName || '').toLowerCase().indexOf(q) !== -1 || (s.phone || '').indexOf(q) !== -1 ||
        (s.email || '').toLowerCase().indexOf(q) !== -1 || (s.studentId || '').indexOf(q) !== -1;
    });
  }
  if (ui.board) students = students.filter(function (s) { return s.board === ui.board; });
  if (ui.cls) students = students.filter(function (s) { return s.class === ui.cls; });
  students.sort(function (a, b) {
    let av = a[ui.sortKey], bv = b[ui.sortKey];
    if (typeof av === 'string') av = av.toLowerCase();
    if (typeof bv === 'string') bv = bv.toLowerCase();
    if (av === undefined || av === null) av = '';
    if (bv === undefined || bv === null) bv = '';
    if (av < bv) return ui.sortDir === 'asc' ? -1 : 1;
    if (av > bv) return ui.sortDir === 'asc' ? 1 : -1;
    return 0;
  });
  const total = students.length;
  const totalPages = Math.max(1, Math.ceil(total / ui.pageSize));
  ui.page = clamp(ui.page, 1, totalPages);
  const pageItems = students.slice((ui.page - 1) * ui.pageSize, ui.page * ui.pageSize);

  if (total === 0) return emptyState('No students registered yet', 'No students match the current search or filters.');

  const rows = pageItems.map(function (s) {

        '<td>' + escapeHtml(s.board) + '</td>' +

      '</tr>'
    );

    '<button class="btn btn-outline btn-sm" data-action="students-page" data-dir="-1" ' + (ui.page <= 1 ? 'disabled' : '') + '>\u2190 Prev</button>' +

    '<button class="btn btn-outline btn-sm" data-action="students-page" data-dir="1" ' + (ui.page >= totalPages ? 'disabled' : '') + '>Next \u2192</button>';

  return (
    '<div class="table-wrap"><table><thead><tr>' +
      '<th>Student ID</th><th>Name</th><th>Phone</th><th>Email</th><th>School</th><th>Board</th><th>Class</th><th>Attempts</th><th>Avg Score</th><th>Last Activity</th><th>Registered</th>' +

function handleAdminWhatsappStudentCredentials(studentId) {
  const student = getStudents().find(function (s) { return s.studentId === studentId; });
  if (!student) return;
  const digits = String(student.phone || '').replace(/[^\d]/g, '');
  if (!digits) { showToast('This student has no valid phone number on file.', 'error'); return; }
  const countryDigits = digits.length === 10 ? '91' + digits : digits;
  const msg = encodeURIComponent(
    'Hi ' + student.fullName + ', here is your TESTora login \u2014\nStudent ID / Phone: ' + student.studentId +
    '\nPassword: ' + student.password + '\n\nPlease keep this safe.'
  );
  window.open('https://wa.me/' + countryDigits + '?text=' + msg, '_blank');
}

/* ==========================================
   ADMIN TESTS LIST
   ========================================== */
function computeTestStats(testId) {
  const attempts = getAttempts().filter(function (a) { return a.testId === testId; });
  if (attempts.length === 0) return { attempts: 0, avgScore: 0, avgPercentage: 0 };
  return {
    attempts: attempts.length,
    avgScore: round2(attempts.reduce(function (s, a) { return s + a.score; }, 0) / attempts.length),
    avgPercentage: round2(attempts.reduce(function (s, a) { return s + a.percentage; }, 0) / attempts.length)
  };
}

function buildAdminTestsResultsHtml() {
  const ui = getTableState('tests', { search: '', board: '', cls: '', status: '', page: 1, pageSize: 8 });
  let tests = getTests().slice();
  if (ui.search) {
    const q = ui.search.toLowerCase();
    tests = tests.filter(function (t) { return t.title.toLowerCase().indexOf(q) !== -1 || (t.chapter || '').toLowerCase().indexOf(q) !== -1; });
  }
  if (ui.board) tests = tests.filter(function (t) { return t.board === ui.board; });
  if (ui.cls) tests = tests.filter(function (t) { return t.class === ui.cls; });
  if (ui.status === 'active') tests = tests.filter(function (t) { return t.active !== false; });
  if (ui.status === 'inactive') tests = tests.filter(function (t) { return t.active === false; });
  tests.sort(function (a, b) { return new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt); });

  const total = tests.length;
  const totalPages = Math.max(1, Math.ceil(total / ui.pageSize));
  ui.page = clamp(ui.page, 1, totalPages);
  const pageItems = tests.slice((ui.page - 1) * ui.pageSize, ui.page * ui.pageSize);
  if (total === 0) return emptyState('No tests yet', 'Create your first test to get started.');

  const rows = pageItems.map(function (t) {
    const stats = computeTestStats(t.testId);
    return (
      '<tr>' +
        '<td>' + escapeHtml(t.title) + (t.isDemo ? ' <span class="badge badge-neutral">Demo</span>' : '') + '</td>' +
        '<td>' + escapeHtml(t.board) + '</td><td>' + escapeHtml(t.class) + '</td><td>' + escapeHtml(t.subjectName) + '</td>' +
        '<td>' + escapeHtml(t.chapter) + '</td><td>' + t.questions.length + '</td><td>' + t.durationMinutes + ' min</td>' +
        '<td>' + stats.attempts + '</td><td>' + stats.avgScore + '</td>' +
        '<td>' + (t.active !== false ? '<span class="badge badge-success">Active</span>' : '<span class="badge badge-danger">Inactive</span>') + '</td>' +
        '<td>' + formatDate(t.updatedAt || t.createdAt) + '</td>' +
        '<td class="tag-row">' +
          '<button class="btn btn-outline btn-sm" data-action="go" data-route="ADMIN_TEST_EDITOR" ' + dataParamsAttr({ testId: t.testId }) + '>Edit</button>' +
          '<button class="btn btn-outline btn-sm" data-action="admin-preview-test" data-test-id="' + t.testId + '">Preview</button>' +
          '<button class="btn btn-outline btn-sm" data-action="admin-duplicate-test" data-test-id="' + t.testId + '">Duplicate</button>' +
          '<button class="btn btn-outline btn-sm" data-action="admin-toggle-test-active" data-test-id="' + t.testId + '">' + (t.active !== false ? 'Deactivate' : 'Activate') + '</button>' +
          '<button class="btn btn-danger-outline btn-sm" data-action="admin-delete-test" data-test-id="' + t.testId + '">Delete</button>' +
        '</td>' +
      '</tr>'
    );
  }).join('');

  const pagerBtns =
    '<button class="btn btn-outline btn-sm" data-action="tests-page" data-dir="-1" ' + (ui.page <= 1 ? 'disabled' : '') + '>\u2190 Prev</button>' +
    '<span class="muted" style="font-size:13px;">Page ' + ui.page + ' of ' + totalPages + ' (' + total + ' tests)</span>' +
    '<button class="btn btn-outline btn-sm" data-action="tests-page" data-dir="1" ' + (ui.page >= totalPages ? 'disabled' : '') + '>Next \u2192</button>';

  return (
    '<div class="table-wrap"><table><thead><tr><th>Title</th><th>Board</th><th>Class</th><th>Subject</th><th>Chapter</th><th>Qs</th><th>Duration</th><th>Attempts</th><th>Avg Score</th><th>Status</th><th>Updated</th><th>Actions</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div class="pagination">' + pagerBtns + '</div>'
  );
}
